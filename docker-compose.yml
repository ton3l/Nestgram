services:
  nestgram:
    container_name: nestgram
    build: .
    ports: 
      - "80:3000"
    env_file: .env.compose
    restart: unless-stopped
    depends_on:
      db_seed:
        condition: service_completed_successfully
    command: sh -c "node src/main.js"
    #command: tail -f /dev/null # Para debbug de dentro do container

  db_seed:
    container_name: db_seed
    build: .
    env_file: .env.compose
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "npx prisma db push" #Trocar por um prisma migrate deploy quando houverem migrations
    
  mysql:
    image: mysql:lts-oraclelinux9
    container_name: mysql_db
    ports:
      - "3306:3306"
    env_file: .env.compose
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
